name: Python u APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instaliraj sustav i Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          pip3 install --upgrade pip "cython<3.0" wheel buildozer

      - name: Napravi APK
        run: |
          yes | buildozer android debug

      - name: Spremi gotov APK za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: ApexTitan-APK
          path: bin/*.apk
